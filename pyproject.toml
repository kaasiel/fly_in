[project]
name = "fly-in"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flake8>=7.4.1",
    "flake8-docstrings>=1.7.0",
    "mypy>=2.4.1",
    "pydantic>=2.14.4",
    "raylib>=6.2.0.0",
]

[tool.mypy]
exclude = [".venv"]
ignore_missing_imports = true

[tool.flake8]
exclude = [".venv"]

[dependency-groups]
dev = [
    "flake8-pyproject>=1.2.4",
]
